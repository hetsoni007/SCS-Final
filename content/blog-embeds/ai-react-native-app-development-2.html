<figure class="flowfig" data-reveal="">
      <svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI React Native app architecture: app to backend to model and vector database">
        <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2DA8C"></stop><stop offset="1" stop-color="#9A7B2E"></stop></linearGradient></defs>
        <!-- app -->
        <rect x="26" y="80" width="120" height="70" rx="13" fill="var(--glass2)" stroke="var(--line2)"></rect>
        <text x="86" y="110" text-anchor="middle" font-size="12.5" fill="var(--t1)" font-family="Inter,sans-serif">React Native</text>
        <text x="86" y="128" text-anchor="middle" font-size="11" fill="var(--t3)" font-family="Inter,sans-serif">iOS + Android</text>
        <!-- backend -->
        <rect x="290" y="70" width="120" height="90" rx="13" fill="var(--glass2)" stroke="url(#fg)"></rect>
        <text x="350" y="100" text-anchor="middle" font-size="12.5" fill="var(--t1)" font-family="Inter,sans-serif">Your backend</text>
        <text x="350" y="118" text-anchor="middle" font-size="10" fill="var(--t3)" font-family="Inter,sans-serif">keys · auth</text>
        <text x="350" y="132" text-anchor="middle" font-size="10" fill="var(--t3)" font-family="Inter,sans-serif">rate limit · cache</text>
        <!-- model -->
        <rect x="556" y="22" width="120" height="64" rx="13" fill="rgba(201,162,75,.1)" stroke="url(#fg)"></rect>
        <text x="616" y="50" text-anchor="middle" font-size="12.5" fill="var(--t1)" font-family="Inter,sans-serif">LLM API</text>
        <text x="616" y="68" text-anchor="middle" font-size="10.5" fill="var(--t3)" font-family="Inter,sans-serif">GPT · Claude</text>
        <!-- vector db -->
        <rect x="556" y="142" width="120" height="64" rx="13" fill="var(--glass2)" stroke="var(--line2)"></rect>
        <text x="616" y="170" text-anchor="middle" font-size="12.5" fill="var(--t1)" font-family="Inter,sans-serif">Vector DB</text>
        <text x="616" y="188" text-anchor="middle" font-size="10.5" fill="var(--t3)" font-family="Inter,sans-serif">your data (RAG)</text>
        <!-- connectors -->
        <line x1="146" y1="115" x2="290" y2="115" stroke="url(#fg)" stroke-width="2.4"></line>
        <line x1="410" y1="100" x2="556" y2="58" stroke="url(#fg)" stroke-width="2.4"></line>
        <line x1="410" y1="130" x2="556" y2="172" stroke="url(#fg)" stroke-width="2.4"></line>
        <!-- moving pulses -->
        <circle class="fig-dot" cx="156" cy="115" r="4.5" fill="url(#fg)" style="--d:124px"></circle>
        <circle class="fig-dot" cx="420" cy="98" r="4.5" fill="url(#fg)" style="--d:126px;animation-delay:.6s"></circle>
        <circle class="pulse" cx="350" cy="160" r="3" fill="url(#fg)"></circle>
      </svg>
      <figcaption>The pattern behind every cloud-backed AI feature we ship: the app talks only to your backend; the backend owns the keys, the retrieval and the streaming.</figcaption>
    </figure>
